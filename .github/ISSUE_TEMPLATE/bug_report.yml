name: Bug report / Relatar problema
description: Report incorrect usage, installation problems or widget behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        English and português brasileiro are welcome. Never include tokens, cookies, credential files, account emails or raw authenticated API responses. Redact screenshots and logs before uploading.
  - type: input
    id: versions
    attributes:
      label: Widget and collector versions / Versões
      description: Include the widget version and the output of ai-usage-collector --version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distribution, Plasma version and session / Ambiente
      placeholder: "Example: Fedora, Plasma 6.x, Wayland"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected component / Componente
      options:
        - Claude
        - Codex
        - Gemini / Antigravity
        - Installation / Instalação
        - Widget interface / Interface
        - Other / Outro
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / Como reproduzir
      description: Describe what you did, what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots / Evidências sem dados privados
      description: For quota differences, compare the provider and widget at the same time. Do not upload credential files.
