name: Release Automation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Sem permissão por padrão; o job pede só o que precisa.
permissions: {}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    # workflow_dispatch só publica a partir de main ou de uma tag, nunca de branch arbitrário.
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Package artifacts
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh

      - name: Determine release tag and title
        id: release_info
        shell: bash
        env:
          TAG_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$TAG_REF"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
              echo "Tag inválida: não segue vX.Y.Z[-sufixo]." >&2
              exit 1
            fi
            TITLE="Release ${TAG}"
          else
            TAG="latest"
            TITLE="Continuous Release (${GITHUB_SHA::7})"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.plasmoid
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publicação no PyPI por Trusted Publisher (OIDC), sem token guardado.
  # O que o mantenedor precisa fazer uma única vez:
  #   1. No GitHub: Settings > Environments > criar o ambiente "pypi" (de preferência com revisor obrigatório).
  #   2. No PyPI: criar o projeto plasma-ai-usage-collector (ou um "pending publisher" se ele ainda não existir).
  #   3. No PyPI: Publishing > adicionar Trusted Publisher com owner victorlcs87,
  #      repo plasma-ai-usage-widget, workflow release.yml e environment pypi.
  # Só roda em tag vX.Y.Z; nunca em push na main nem em workflow_dispatch sem tag.
  pypi-build:
    name: Build PyPI distributions
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # A tag entra só por variável de ambiente (nunca interpolada no script).
      - name: Validate tag and versions
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag inválida: não segue vX.Y.Z[-sufixo]." >&2
            exit 1
          fi
          python scripts/check-release-versions.py "$TAG_REF"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build --outdir dist-pypi
          twine check dist-pypi/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist-pypi/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: pypi-build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist-pypi/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-pypi/
